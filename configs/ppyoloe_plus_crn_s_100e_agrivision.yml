# ============================================================
# PP-YOLOE+ Baseline — AIC2026 农业视觉目标检测 (PlantDoc 13类)
# ============================================================
# 严格基于官方 PP-YOLOE+ 结构, 不修改网络/不加任何创新模块。
# 仅修改: num_classes / 数据集路径 / epoch / batch_size / lr / save_dir
# 模型规模: PP-YOLOE+-s (depth_mult=0.33, width_mult=0.50) 适合 13类/1144图 baseline
# ============================================================
_BASE_: [
  './datasets/agrivision_detection.yml',
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/optimizer_80e.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_crn.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_reader.yml',
]

log_iter: 20
snapshot_epoch: 5
weights: output/ppyoloe_plus_crn_s_100e_agrivision/model_final

# 预训练: Objects365 预训练骨干 (官方默认, 不替换)
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/pretrained/ppyoloe_crn_s_obj365_pretrained.pdparams
depth_mult: 0.33
width_mult: 0.50

# ---- 仅允许修改的训练参数 ----
epoch: 100

LearningRate:
  base_lr: 0.001   # 默认 bs=8; 若改 batch_size 须按线性缩放 (lr_new = 0.001 * bs/8)
  schedulers:
    - name: CosineDecay
      max_epochs: 100   # 与 epoch=100 完全一致, lr 从 base_lr 余弦衰减到 0
    - name: LinearWarmup
      start_factor: 0.
      epochs: 5

TrainReader:
  batch_size: 8   # 初始值; AutoDL 上按显存调整 (4GB→2, 8-11GB→8, 16GB+→16), 同步改 base_lr

EvalReader:
  batch_size: 2
