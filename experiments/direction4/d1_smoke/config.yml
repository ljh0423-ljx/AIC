# ============================================================
# D1 Smoke Test — 仅验证 D1 训练管线与校准机制, 不作为正式结果
# 基于 ablation_dir4_D1.yml, 仅改 epoch/snapshot/scheduler/log_iter
# 用法: MODE=smoke bash scripts/train_dir4_d1.sh
# ============================================================
_BASE_: ['./ablation_dir4_D1.yml']

epoch: 2
snapshot_epoch: 1
log_iter: 5

LearningRate:
  schedulers:
    - name: CosineDecay
      max_epochs: 2   # 与 epoch=2 一致
    - name: LinearWarmup
      start_factor: 0.
      epochs: 1
