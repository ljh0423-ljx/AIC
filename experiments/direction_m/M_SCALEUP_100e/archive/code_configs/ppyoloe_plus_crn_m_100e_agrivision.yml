# ============================================================
# PP-YOLOE+ M — AIC2026 农业视觉目标检测 (PlantDoc 13类)
# ============================================================
# 严格基于官方 PP-YOLOE+ 结构, 与 A0 (ppyoloe_plus_crn_s_100e_agrivision.yml)
# 的唯一差异 = 模型规模 s->m:
#   - depth_mult: 0.33 -> 0.67
#   - width_mult: 0.50 -> 0.75
#   - pretrain_weights: 官方 ppyoloe_crn_s_obj365 -> 官方 ppyoloe_crn_m_obj365
#   - weights: 输出目录 -> ..._m
# 其余全部训练条件与 A0 完全一致 (13类/EXIF-fix数据/epoch=100/batch-lr/EMA/评估)。
# 不修改损失函数/数据集/EXIF处理/数据增强, 不引入任何其他算法机制。
# ============================================================
_BASE_: [
  './datasets/agrivision_detection.yml',
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/optimizer_80e.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_crn.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_reader.yml',
]

log_iter: 20
snapshot_epoch: 5
weights: output/ppyoloe_plus_crn_m_100e_agrivision/model_final

# 预训练: Objects365 预训练骨干 (官方 m 默认, 不用 PV_CORE)
pretrain_weights: /root/.cache/paddle/weights/ppyoloe_crn_m_obj365_pretrained.pdparams
depth_mult: 0.67
width_mult: 0.75

# ---- 仅允许修改的训练参数 (与 A0 完全一致) ----
epoch: 100

LearningRate:
  base_lr: 0.001   # 默认 bs=8; 若改 batch_size 须按线性缩放 (lr_new = 0.001 * bs/8)
  schedulers:
    - name: CosineDecay
      max_epochs: 100   # 与 epoch=100 完全一致, lr 从 base_lr 余弦衰减到 0
    - name: LinearWarmup
      start_factor: 0.
      epochs: 5

TrainReader:
  batch_size: 8   # 初始值; AutoDL 上按显存调整 (4GB→2, 8-11GB→8, 16GB+→16), 同步改 base_lr

EvalReader:
  batch_size: 2
