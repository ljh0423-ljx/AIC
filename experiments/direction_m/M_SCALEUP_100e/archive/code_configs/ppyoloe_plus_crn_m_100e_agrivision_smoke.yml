# ============================================================
# PP-YOLOE+ M SMOKE TEST (2 epoch) — 仅用于验证加载/梯度/loss/VAL 管线/显存
# ============================================================
# 与 M 正式配置 (ppyoloe_plus_crn_m_100e_agrivision.yml) 唯一差异:
# epoch=2 / snapshot_epoch=1 / CosineDecay.max_epochs=2 /
# LinearWarmup.epochs=1 / weights 指向 smoke 输出。
# 通过后即弃用, 正式训练使用正式配置。
# ============================================================
_BASE_: [
  './datasets/agrivision_detection.yml',
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/optimizer_80e.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_crn.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_reader.yml',
]

log_iter: 20
snapshot_epoch: 1
weights: output/ppyoloe_plus_crn_m_100e_agrivision_smoke/model_final

# 预训练: 与 M 正式配置相同 (官方 obj365 m)
pretrain_weights: /root/.cache/paddle/weights/ppyoloe_crn_m_obj365_pretrained.pdparams
depth_mult: 0.67
width_mult: 0.75

epoch: 2

LearningRate:
  base_lr: 0.001
  schedulers:
    - name: CosineDecay
      max_epochs: 2
    - name: LinearWarmup
      start_factor: 0.
      epochs: 1

TrainReader:
  batch_size: 8

EvalReader:
  batch_size: 2
