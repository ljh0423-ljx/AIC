# ============================================================
# PP-YOLOE+-s + S1 CG-ACS 正式 100 epoch 配置
# 基于 A0 100e 配置 (ppyoloe_plus_crn_s_100e_agrivision.yml), 仅追加:
#   图像级辅助分类头 CGACSAuxClsHead (train-only, 推理旁路)
# 检测头 PPYOLOEHead 完全不变; lambda_cls=0.1 为唯一新增变量 (固定, 不调参)
# 训练条件与 A0 完全一致: 由命令 -o TrainReader.batch_size=16
#   LearningRate.base_lr=0.002 覆盖 (见 S1 train_command), epoch/snapshot/EMA/LR
#   计划/增强/种子全部继承 A0。
# ============================================================
_BASE_: ['./ppyoloe_plus_crn_s_100e_agrivision.yml']

epoch: 100
snapshot_epoch: 5
log_iter: 20

# ---- S1 CG-ACS: 图像级辅助分类头 (train-only, 推理旁路) ----
YOLOv3:
  backbone: CSPResNet
  neck: CustomCSPPAN
  yolo_head: PPYOLOEHead
  aux_cls_head: CGACSAuxClsHead
  post_process: ~

CGACSAuxClsHead:
  in_channels: 96        # P3 通道数 (neck 返回序 [P5,P4,P3] 中 index=2, stride 8)
  num_classes: 13
  lambda_cls: 0.1        # 唯一新增变量, 固定不调参
  feat_idx: 2            # 2 = P3 (stride 8, 96ch)
